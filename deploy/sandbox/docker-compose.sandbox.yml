# ─────────────────────────────────────────────────────────────────────────────
# Self-hosted reference deployment (lab VM, institution server, LAN box).
#
# Every component runs on the host: models (Ollama), vectors (Qdrant),
# operational records (MongoDB), attachments (MinIO), OCR, transcription and the
# two MCP servers. Nothing is managed, and no request leaves the network.
#
#   cp deploy/sandbox/.env.sandbox.example .env.sandbox
#   docker compose --env-file .env.sandbox \
#     -f deploy/sandbox/docker-compose.sandbox.yml up -d --build
#
# Put a reverse proxy (TLS) in front of `api` and `web`; set WEB_PUBLIC_URL to
# the public origin so signed approval links are built correctly.
# ─────────────────────────────────────────────────────────────────────────────

name: sps-sandbox

services:
  # ── Local model server (LLM + embeddings) ───────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    expose: ["11434"]
    # GPU support: uncomment for NVIDIA on the host.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [sps]

  # ── Optional local reranker (TEI) ───────────────────────────────────────────
  rerank:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    restart: unless-stopped
    command: ["--model-id", "${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}"]
    volumes:
      - tei-data:/data
    expose: ["80"]
    profiles: ["rerank"]
    networks: [sps]

  # ── Vector knowledge base ───────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
      QDRANT__LOG_LEVEL: ${QDRANT_LOG_LEVEL:-INFO}
    expose: ["6333", "6334"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [sps]

  # ── Operational store (audit, runs, contacts, outbox) ──────────────────────
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB_NAME:-policy_sandbox}
    expose: ["27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [sps]

  # ── Object storage (MinIO) ──────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-sps-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-sps-minio-secret}
    volumes:
      - minio-data:/data
    expose: ["9000", "9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [sps]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/"$$S3_BUCKET" &&
        echo "bucket ready: $$S3_BUCKET"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-sps-attachments}
    restart: "no"
    networks: [sps]

  # ── Knowledge-base plane ───────────────────────────────────────────────────
  ingestion:
    build:
      context: ../..
      dockerfile: services/ingestion/Dockerfile
    image: ${SPS_REGISTRY:-sarkiai}/sps-ingestion:${SPS_TAG:-local}
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      PORT: "8000"
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-policy_chunks}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      DEFAULT_CHUNK_SIZE: ${DEFAULT_CHUNK_SIZE:-900}
      DEFAULT_CHUNK_OVERLAP: ${DEFAULT_CHUNK_OVERLAP:-120}
      OCR_URL: http://ocr:8000
      SERVICE_API_KEY: ${SERVICE_API_KEY:-change-me-service-key}
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [sps]

  ocr:
    build:
      context: ../..
      dockerfile: services/ocr/Dockerfile
    image: ${SPS_REGISTRY:-sarkiai}/sps-ocr:${SPS_TAG:-local}
    restart: unless-stopped
    environment:
      PORT: "8000"
      OCR_LANGUAGES: ${OCR_LANGUAGES:-fra+eng}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-change-me-service-key}
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [sps]

  transcription:
    build:
      context: ../..
      dockerfile: services/transcription/Dockerfile
    image: ${SPS_REGISTRY:-sarkiai}/sps-transcription:${SPS_TAG:-local}
    restart: unless-stopped
    environment:
      PORT: "8000"
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-change-me-service-key}
    volumes:
      - whisper-data:/models
    tmpfs:
      - /tmp:size=1g
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    profiles: ["media"]
    networks: [sps]

  # ── Local MCP servers ─────────────────────────────────────────────────────
  mcp-charts:
    build:
      context: ../../services/mcp-charts
    image: ${SPS_REGISTRY:-sarkiai}/sps-mcp-charts:${SPS_TAG:-local}
    restart: unless-stopped
    environment:
      PORT: "3000"
      MCP_API_KEY: ${MCP_API_KEY:-change-me-mcp-key}
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [sps]

  mcp-docx:
    build:
      context: ../../services/mcp-docx
    image: ${SPS_REGISTRY:-sarkiai}/sps-mcp-docx:${SPS_TAG:-local}
    restart: unless-stopped
    environment:
      PORT: "3000"
      MCP_API_KEY: ${MCP_API_KEY:-change-me-mcp-key}
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [sps]

  # ── Application plane ──────────────────────────────────────────────────────
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: prod
    image: ${SPS_REGISTRY:-sarkiai}/sps-api:${SPS_TAG:-local}
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ingestion:
        condition: service_healthy
    env_file:
      - .env.sandbox
    environment:
      PORT: "8000"
      HOST: "0.0.0.0"
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-policy_chunks}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-policy_sandbox}
      INGESTION_URL: http://ingestion:8000
      OLLAMA_BASE_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:9b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      RERANK_URL: ${RERANK_URL:-}
      RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      OCR_URL: http://ocr:8000
      TRANSCRIPTION_URL: http://transcription:8000
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-sps-attachments}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      MCP_CHARTS_URL: http://mcp-charts:3000/mcp
      MCP_DOCX_URL: http://mcp-docx:3000/mcp
      MCP_API_KEY: ${MCP_API_KEY}
      SERVICE_API_KEY: ${SERVICE_API_KEY}
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [sps]

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL:-http://localhost:3000}
    image: ${SPS_REGISTRY:-sarkiai}/sps-web:${SPS_TAG:-local}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: "3000"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      MCP_CHARTS_URL: http://mcp-charts:3000/mcp
      MCP_DOCX_URL: http://mcp-docx:3000/mcp
      MCP_API_KEY: ${MCP_API_KEY}
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [sps]

volumes:
  ollama-data:
  tei-data:
  qdrant-data:
  mongo-data:
  minio-data:
  whisper-data:

networks:
  sps:
    driver: bridge
