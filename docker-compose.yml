# ─────────────────────────────────────────────────────────────────────────────
# SarkiAI Policy Sandbox — full stack
#
#   docker compose up --build            # everything
#   docker compose up qdrant ingestion   # just the knowledge-base plane
#   docker compose up api web            # just the application plane
#
# Vector search is Qdrant (open source, multi-arch, hybrid dense+sparse).
# MongoDB is kept ONLY for operational data (audit log + chain-of-thought).
# ─────────────────────────────────────────────────────────────────────────────

name: sarkiai-policy-sandbox

x-common-env: &common-env
  NODE_ENV: ${NODE_ENV:-development}
  SERVICE_API_KEY: ${SERVICE_API_KEY:-change-me-service-key}

services:
  # ── Vector knowledge base ───────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: sps-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
      QDRANT__LOG_LEVEL: ${QDRANT_LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [sps-net]

  # ── Operational data store (audit + chain-of-thought), no vectors ───────────
  mongo:
    image: mongo:7.0
    container_name: sps-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB_NAME:-policy_sandbox}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [sps-net]

  # ── Knowledge-base plane ───────────────────────────────────────────────────
  # Structure-aware legal chunking + VoyageAI embeddings + Qdrant (dense+sparse).
  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    image: sarkiai/sps-ingestion:local
    container_name: sps-ingestion
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      <<: *common-env
      PORT: "8000"
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-policy_chunks}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      VOYAGE_EMBEDDING_MODEL: ${VOYAGE_EMBEDDING_MODEL:-voyage-4}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-128}
      DEFAULT_CHUNK_SIZE: ${DEFAULT_CHUNK_SIZE:-900}
      DEFAULT_CHUNK_OVERLAP: ${DEFAULT_CHUNK_OVERLAP:-120}
      OCR_URL: ${OCR_URL:-http://ocr:8000}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-change-me-service-key}
    ports:
      - "${INGESTION_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [sps-net]

  # Scanned gazette / image OCR fallback (Tesseract).
  ocr:
    build:
      context: .
      dockerfile: services/ocr/Dockerfile
    image: sarkiai/sps-ocr:local
    container_name: sps-ocr
    restart: unless-stopped
    environment:
      <<: *common-env
      PORT: "8000"
      OCR_LANGUAGES: ${OCR_LANGUAGES:-fra+eng}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-change-me-service-key}
    ports:
      - "${OCR_PORT:-8002}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [sps-net]

  # Optional: media → timestamped transcript (policy briefings, hearings).
  transcription:
    build:
      context: .
      dockerfile: services/transcription/Dockerfile
    image: sarkiai/sps-transcription:local
    container_name: sps-transcription
    restart: unless-stopped
    environment:
      <<: *common-env
      PORT: "8000"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_AUDIO_MODEL_NAME: ${GROQ_AUDIO_MODEL_NAME:-whisper-large-v3-turbo}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-change-me-service-key}
    ports:
      - "${TRANSCRIPTION_PORT:-8003}:8000"
    tmpfs:
      - /tmp:size=1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    profiles: ["full", "media"]
    networks: [sps-net]

  # ── Application plane ──────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: sarkiai/sps-api:local
    container_name: sps-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ingestion:
        condition: service_healthy
    env_file:
      - .env
    environment:
      <<: *common-env
      PORT: "8000"
      HOST: "0.0.0.0"
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-policy_chunks}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-policy_sandbox}
      INGESTION_URL: ${INGESTION_URL:-http://ingestion:8000}
      OCR_URL: ${OCR_URL:-http://ocr:8000}
      TRANSCRIPTION_URL: ${TRANSCRIPTION_URL:-http://transcription:8000}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [sps-net]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: sarkiai/sps-web:local
    container_name: sps-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *common-env
      PORT: "3000"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [sps-net]

volumes:
  qdrant-data:
  mongo-data:

networks:
  sps-net:
    driver: bridge
